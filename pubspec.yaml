name: flutter_local_agent_kit
description: Offline-first AI framework for Flutter. Resident LLM inference, local RAG, and autonomous agents with a Material 3 Chat UI.
version: 1.1.6
homepage: https://github.com/Akash-ptl/flutter_local_agent_kit
repository: https://github.com/Akash-ptl/flutter_local_agent_kit
issue_tracker: https://github.com/Akash-ptl/flutter_local_agent_kit/issues


environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  crypto: ^3.0.7
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_tts: ^4.2.5
  image_picker: ^1.2.3
  llamadart: ^0.8.19
  markdown: ^7.3.1
  math_expressions: ^3.2.0
  mcp_dart: ^2.4.1
  mobile_rag_engine: ^0.20.0
  path: ^1.9.1
  path_provider: ^2.1.6
  speech_to_text: ^7.4.0
  syncfusion_flutter_pdf: ^34.2.4
  uuid: ^4.6.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
